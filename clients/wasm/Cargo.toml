[package]
name = "zed-client-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser/worker WebAssembly SDK for the zed-pkg registry"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-clients"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# DEN-3282: keep the browser SDK on the same exact contract authority as the
# native SDK and CLI. This is the reviewed source-composition contract from
# zed-interfaces#138.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "aa0f87be13cdf003600b42a6088202898fcbae8d" }
hex = "0.4"
js-sys = "0.3"
percent-encoding = "2"
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
url = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "FormData",
  "Headers",
  "Request",
  "RequestInit",
  "RequestRedirect",
  "Response",
] }
