[package]
name = "zed-client"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the zed-pkg registry"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-clients"

[dependencies]
# All Rust consumers share one exact contract crate and one exact behavior
# crate. This keeps zed-cli, the SDK, and zed-lib on identical wire/model types.
# DEN-3495 pins the merged Git CLI install receipt authority; its independent
# TypeSpec and authored Draft 2020-12 JSON Schema sources are cross-checked by
# ORESoftware/typespec-json-schema-validator before admission.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1" }
zed-lib = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "c8af76191f50ad7a177eb68740e69bdfaa652ff6" }
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
