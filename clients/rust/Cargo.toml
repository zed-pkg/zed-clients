[package]
name = "zed-client"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the zed-pkg registry"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-clients"

[dependencies]
# All Rust consumers share one exact contract crate and one exact behavior
# crate. This keeps zed-cli, the SDK, and zed-lib on identical wire/model types.
# Pin the source-composition interfaces authority and the zed-lib revision that
# consumes that same immutable crate identity so nominal Rust types cannot split.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "281fc4fbf57a46c81ea224c59c1bddd7784b0719" }
zed-lib = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "c4c70a160039c315b4960405311f15a8a1f020c7" }
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
