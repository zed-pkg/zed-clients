[package]
name = "zed-client"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the zed-pkg registry"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-clients"

[dependencies]
# All Rust consumers share one exact contract crate and one exact behavior
# crate. DEN-3282 advances both together: zed-interfaces#138 owns the typed
# source-composition contract, and zed-lib-core#71 is the first merged behavior
# producer compiled against that same immutable interface identity.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "aa0f87be13cdf003600b42a6088202898fcbae8d" }
zed-lib = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "74224ea2e125adede0b3b58676d8a089e5250788" }
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
