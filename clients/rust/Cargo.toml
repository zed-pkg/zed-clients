[package]
name = "zed-client"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the zed-pkg registry"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-clients"

[dependencies]
# All Rust consumers share one exact contract crate and one exact behavior
# crate. This keeps zed-cli, the SDK, and zed-lib on identical wire/model types.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e" }
zed-lib = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "eac0878750332b031bc12f6040b6a795a17e7417" }
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
