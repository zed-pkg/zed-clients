[package]
name = "zed-client"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the zed-pkg registry"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-clients"

[dependencies]
# All Rust consumers share one exact contract crate and one exact behavior
# crate. This keeps zed-cli, the SDK, and zed-lib on identical wire/model types.
# Pin the latest interfaces main revision admitted by the full TJSV/private-
# persistence matrix. The d11322.. -> 6e8f65.. delta does not modify src/rust.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "6e8f65d786330ade0cdc89f9877bba42c9e8f21a" }
zed-lib = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "c8af76191f50ad7a177eb68740e69bdfaa652ff6" }
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
