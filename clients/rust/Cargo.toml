[package]
name = "zed-client"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the zed-pkg registry"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-clients"

[dependencies]
# All Rust consumers share one exact contract crate and one exact behavior
# crate. This keeps zed-cli, the SDK, and zed-lib on identical wire/model types.
# Pin the reviewed DEN-3282 interface authority and the zed-lib
# bridge that consumes that same exact authority so the direct and transitive Rust model
# types resolve from one immutable zed-interfaces crate identity.
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "aa0f87be13cdf003600b42a6088202898fcbae8d" }
zed-lib = { git = "https://github.com/zed-pkg/zed-lib-core.git", rev = "3ddec299e490f1a016e242eac32e5070bc0d0131" }
hex = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
