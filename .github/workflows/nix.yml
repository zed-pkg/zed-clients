name: nix

on:
  pull_request:
    paths:
      - clients/swift/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-swift-test-transport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false

      - name: Add deterministic bounded test transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          production = Path('clients/swift/Sources/ZedClient/ZedClient.swift')
          source = production.read_text(encoding='utf-8')
          source = replace_once(source, 'private struct ErrorEnvelope: Decodable {\n    let code: String?\n}\n', 'private struct ErrorEnvelope: Decodable {\n    let code: String?\n}\n\ntypealias DataLoader = (\n    URLRequest,\n    Int,\n    Int\n) async throws -> (Data, HTTPURLResponse)\n', 'data loader type')
          source = replace_once(source, 'private let protocolClasses: [AnyClass]?', 'private let dataLoader: DataLoader?', 'stored loader')
          source = replace_once(source, 'self.protocolClasses = nil', 'self.dataLoader = nil', 'public initializer')
          source = replace_once(source, 'protocolClasses: [AnyClass]?', 'dataLoader: DataLoader?', 'test initializer parameter')
          source = replace_once(source, 'self.protocolClasses = protocolClasses', 'self.dataLoader = dataLoader', 'test initializer assignment')
          source = replace_once(source, '        try await withCheckedThrowingContinuation { continuation in\n', '        if let dataLoader {\n            return try await dataLoader(request, successLimit, errorLimit)\n        }\n        return try await withCheckedThrowingContinuation { continuation in\n', 'loader dispatch')
          source = replace_once(source, '            configuration.protocolClasses = protocolClasses\n', '', 'production URLSession configuration')
          production.write_text(source, encoding='utf-8')

          tests = Path('clients/swift/Tests/ZedClientTests/ZedClientTests.swift')
          test_source = tests.read_text(encoding='utf-8')
          test_source = test_source.replace('StubURLProtocol.handler', 'StubTransport.handler')
          test_source = replace_once(test_source, 'protocolClasses: [StubURLProtocol.self]', 'dataLoader: StubTransport.load', 'test initializer call')
          pattern = re.compile(r'private final class StubURLProtocol: URLProtocol \{.*?\n\}\n\nprivate func bodyData', re.DOTALL)
          replacement = '''private enum StubTransport {
              static var handler: ((URLRequest) throws -> StubResponse)?

              static func load(
                  _ request: URLRequest,
                  _ successLimit: Int,
                  _ errorLimit: Int
              ) async throws -> (Data, HTTPURLResponse) {
                  let handler = try XCTUnwrap(Self.handler)
                  let stub = try handler(request)
                  let response = try XCTUnwrap(HTTPURLResponse(
                      url: try XCTUnwrap(request.url),
                      statusCode: stub.status,
                      httpVersion: "HTTP/1.1",
                      headerFields: stub.headers
                  ))
                  let successful = (200..<300).contains(stub.status)
                  let limit = successful ? successLimit : errorLimit
                  let declared = stub.headers.first { key, _ in
                      key.caseInsensitiveCompare("Content-Length") == .orderedSame
                  }.flatMap { Int($0.value) }
                  if successful && (declared ?? stub.body.count) > limit {
                      throw ZedClientError.responseTooLarge(limit: limit)
                  }
                  return (Data(stub.body.prefix(limit)), response)
              }
          }

          private func bodyData'''
          test_source, count = pattern.subn(replacement, test_source, count=1)
          if count != 1:
              raise SystemExit(f'test transport block: expected one match, found {count}')
          tests.write_text(test_source, encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push the asserted patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clients/swift/Sources/ZedClient/ZedClient.swift clients/swift/Tests/ZedClientTests/ZedClientTests.swift
          git commit -m 'DEN-359 inject the Swift test transport directly'
          git push origin HEAD:${{ github.head_ref }}
