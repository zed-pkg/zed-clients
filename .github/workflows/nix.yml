name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - .zpkg.toml
      - .zpkg.lock
      - scripts/validate-client-matrix.py
      - clients/**
      - README.md
      - AGENTS.md
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - .zpkg.toml
      - .zpkg.lock
      - scripts/validate-client-matrix.py
      - clients/**
      - README.md
      - AGENTS.md
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out zed-clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: zed-clients
          persist-credentials: false
          show-progress: false

      - name: Check out the pinned interface contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-interfaces
          ref: f8852622c9b98308e6851342f0ce152c4253b377
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run the complete pinned agent check
        working-directory: zed-clients
        run: nix develop --no-update-lock-file -c agent-check
