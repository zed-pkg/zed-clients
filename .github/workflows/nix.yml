name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - .zpkg.toml
      - .zpkg.lock
      - scripts/validate-client-matrix.py
      - clients/**
      - README.md
      - agents.md
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - .zpkg.toml
      - .zpkg.lock
      - scripts/validate-client-matrix.py
      - clients/**
      - README.md
      - agents.md
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remaining-runtime:
    name: pinned ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage: [erlang, java, swift]
    steps:
      - name: Check out zed-clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: zed-clients
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run pinned runtime stage
        working-directory: zed-clients
        run: nix develop --no-update-lock-file -c agent-check "${{ matrix.stage }}"
