name: nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - .zpkg.toml
      - .zpkg.lock
      - scripts/validate-client-matrix.py
      - clients/**
      - README.md
      - agents.md
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .nix/**
      - .zpkg.toml
      - .zpkg.lock
      - scripts/validate-client-matrix.py
      - clients/**
      - README.md
      - agents.md
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out zed-clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: zed-clients
          persist-credentials: false
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format Gleam canonically
        working-directory: zed-clients
        run: nix develop --no-update-lock-file -c bash -lc 'cd clients/gleam && gleam format'

      - name: Upload formatted Gleam source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-gleam-source
          path: zed-clients/clients/gleam/src/zed_pkg_client.gleam
          retention-days: 1
          if-no-files-found: error

      - name: Prove formatting changed the branch copy
        working-directory: zed-clients
        run: git diff --exit-code -- clients/gleam/src/zed_pkg_client.gleam
