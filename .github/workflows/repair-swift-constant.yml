name: repair Swift constant

on:
  push:
    branches:
      - alexanderdmills/den-359-zed-clients-nix-agent-shell
    paths:
      - .github/workflows/repair-swift-constant.yml
      - clients/swift/Sources/ZedClient/ZedClient.swift

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          show-progress: false

      - name: Replace exactly one truncated SHA-256 constant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('clients/swift/Sources/ZedClient/ZedClient.swift')
          source = path.read_text(encoding='utf-8')
          bad = '0xc24b70'
          good = '0xc24b8b70'
          if source.count(bad) != 1:
              raise SystemExit(f'expected exactly one {bad!r}, found {source.count(bad)}')
          path.write_text(source.replace(bad, good, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- clients/swift/Sources/ZedClient/ZedClient.swift

      - name: Commit the mechanical correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clients/swift/Sources/ZedClient/ZedClient.swift
          git commit -m 'DEN-359 restore the canonical Swift SHA constant'
          git push origin HEAD:${GITHUB_REF_NAME}
