name: Standardize Zed client matrix

on:
  push:
    branches:
      - agent/standardize-zed-client-matrix-20260805

permissions:
  contents: write

jobs:
  standardize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check tomlkit
      - run: python scripts/standardize_zed_matrix.py --kind clients --prefix zed --mobile false
      - name: Commit generated matrix
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "zed-pkg automation"
          git config user.email "zed-pkg-automation@users.noreply.github.com"
          git add .zpkg.toml clients
          git commit -m "feat: complete polyglot client matrix [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
