name: one-shot DEN-388 rustfmt

on:
  push:
    branches:
      - DEN-388-fallback-transport-hardening-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-388-fallback-transport-hardening-v1
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Format async client stack
        working-directory: clients/rust-async
        run: cargo fmt
      - name: Commit exact rustfmt output
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/rust-async/src/hardening.rs clients/rust-async/tests/hardening_contract.rs
          if git diff --cached --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git commit -m 'style: rustfmt fallback hardening stack'
          git push origin HEAD:DEN-388-fallback-transport-hardening-v1
