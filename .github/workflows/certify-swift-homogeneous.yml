name: certify ABI-homogeneous Swift 6.1.3 shell

on:
  push:
    branches:
      - alexanderdmills/den-359-zed-clients-nix-agent-shell-v6
    paths:
      - .github/workflows/certify-swift-homogeneous.yml

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: alexanderdmills/den-359-zed-clients-nix-agent-shell-v6
          path: zed-clients
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: 6e893ad0f28ccfbb7722f007d75e88548f1bcfdf
          path: zed-interfaces
          persist-credentials: false
          show-progress: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Lock and format both immutable Nixpkgs inputs
        working-directory: zed-clients
        run: |
          set -euo pipefail
          nix flake lock --update-input swift-compat
          nix shell nixpkgs#nixfmt -c nixfmt \
            flake.nix \
            .nix/dev-shell.nix \
            .nix/swift-release.nix
          nix-instantiate --parse flake.nix >/dev/null
          git diff --check
      - name: Certify current toolchain shell without Swift injection
        working-directory: zed-clients
        run: nix develop --no-update-lock-file .#toolchains -c agent-check toolchains
      - name: Certify the ABI-homogeneous official Swift shell
        working-directory: zed-clients
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file .#swift -c swift --version
          nix develop --no-update-lock-file .#swift -c agent-check swift
      - name: Remove builder and commit immutable environment files
        working-directory: zed-clients
        run: |
          set -euo pipefail
          rm .github/workflows/certify-swift-homogeneous.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            flake.nix \
            flake.lock \
            .nix/agent-check.sh \
            .nix/dev-shell.nix \
            .nix/swift-release.nix \
            .github/workflows/certify-swift-homogeneous.yml
          git diff --cached --check
          git commit -m 'build: pin ABI-homogeneous Swift 6.1.3 shell'
          git push origin HEAD:alexanderdmills/den-359-zed-clients-nix-agent-shell-v6
