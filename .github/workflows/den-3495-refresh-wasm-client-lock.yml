name: DEN-3495 refresh Wasm client lock

on:
  push:
    branches:
      - feat/DEN-3495-align-git-cli-install-contract
    paths:
      - ".github/workflows/den-3495-refresh-wasm-client-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/DEN-3495-align-git-cli-install-contract
          fetch-depth: 1
          persist-credentials: true
      - name: Install Wasm Rust target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: wasm32-unknown-unknown
      - name: Refresh reviewed interface Git source in Wasm lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("clients/wasm/Cargo.lock")
          old = "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e"
          new = "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1"
          text = path.read_text()
          count = text.count(old)
          if count < 1:
              raise SystemExit(f"expected at least one occurrence of {old}, found {count}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          cargo test --locked --manifest-path clients/wasm/Cargo.toml
          cargo check --locked --manifest-path clients/wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Commit deterministic Wasm lock refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "automation@oresoftware.com"
          git add clients/wasm/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(DEN-3495): refresh Wasm client contract lock"
          git push origin HEAD:feat/DEN-3495-align-git-cli-install-contract
