name: Refresh client interface locks and fingerprints

on:
  push:
    branches:
      - chore/repin-rust-wasm-interfaces-20260910
    paths:
      - clients/rust/Cargo.toml
      - clients/wasm/Cargo.toml
      - clients/contract-manifest.json
      - scripts/harden_client_contract.py
      - .github/workflows/refresh-client-contract-fingerprints.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: chore/repin-rust-wasm-interfaces-20260910
      - name: Install exact Rust resolver toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned hardener dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 tomlkit==0.13.3
      - name: Refresh Cargo lock source identities
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          cargo metadata --manifest-path clients/rust/Cargo.toml --format-version 1 > /tmp/rust-client-metadata.json
          cargo metadata --manifest-path clients/wasm/Cargo.toml --format-version 1 > /tmp/wasm-client-metadata.json
          grep -Fq 'git+https://github.com/zed-pkg/zed-interfaces.git?rev=0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c#0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c' clients/rust/Cargo.lock
          grep -Fq 'git+https://github.com/zed-pkg/zed-interfaces.git?rev=0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c#0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c' clients/wasm/Cargo.lock
      - name: Refresh deterministic contract evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/harden_client_contract.py \
            --root . \
            --schema clients/client-api.schema.json \
            --write \
            --output /tmp/client-contract-refresh.json
          cat /tmp/client-contract-refresh.json
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            clients/contract-manifest.json \
            clients/rust/Cargo.lock \
            clients/wasm/Cargo.lock)"
          test "$changed" = "$expected" || {
            echo 'unexpected generated changes:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
      - name: Commit generated locks and fingerprints only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/rust/Cargo.lock clients/wasm/Cargo.lock clients/contract-manifest.json; then
            echo 'expected generated evidence did not change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/rust/Cargo.lock clients/wasm/Cargo.lock clients/contract-manifest.json
          git commit -m 'chore: refresh interface locks and contract fingerprints'
          git push origin HEAD:chore/repin-rust-wasm-interfaces-20260910
