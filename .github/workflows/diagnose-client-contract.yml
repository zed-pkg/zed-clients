name: Diagnose generated client contract

on:
  push:
    branches:
      - feat/shared-rust-client-boundary
    paths:
      - ".github/workflows/diagnose-client-contract.yml"
      - "clients/**"
      - "scripts/harden_client_contract.py"
      - "schemas/client-api.schema.json"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install contract tooling
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 tomlkit==0.13.3

      - name: Generate authoritative receipts
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/client-contract-diagnostic"
          mkdir -p "$output/generated"
          set +e
          python scripts/harden_client_contract.py \
            --schema schemas/client-api.schema.json \
            --write \
            --output "$output/result.json" \
            > "$output/stdout.json" \
            2> "$output/stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$output/generator-exit-code.txt"
          git status --short > "$output/git-status.txt"
          git diff --binary -- . ':!.github/workflows/diagnose-client-contract.yml' > "$output/generated.patch"
          python - "$output" <<'PY'
          import json
          import pathlib
          import shutil
          import sys

          output = pathlib.Path(sys.argv[1])
          result = json.loads((output / "result.json").read_text(encoding="utf-8"))
          root = pathlib.Path.cwd().resolve()
          for relative in result.get("changed", []):
              source = (root / relative).resolve()
              if not source.is_relative_to(root) or not source.is_file():
                  raise SystemExit(f"invalid generated path: {relative}")
              destination = output / "generated" / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY
          python scripts/verify_client_contract.py \
            > "$output/verify-stdout.txt" \
            2> "$output/verify-stderr.txt" || true

      - name: Upload deterministic diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-client-contract-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/client-contract-diagnostic
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: true
