name: Reusable Zed package standardizer

on:
  workflow_call:
    inputs:
      kind:
        description: Zed package kind
        required: true
        type: string
      prefix:
        description: Package-family prefix
        required: true
        type: string
      mobile:
        description: Whether Kotlin and Swift targets apply
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check tomlkit
      - run: curl -fsSL https://raw.githubusercontent.com/zed-pkg/zed-clients/c144b955669e3ae07c4f3a8c8b05640a1a610001/scripts/standardize_zed_matrix.py -o /tmp/standardize_zed_matrix.py
      - run: python /tmp/standardize_zed_matrix.py --kind "${{ inputs.kind }}" --prefix "${{ inputs.prefix }}" --mobile "${{ inputs.mobile }}"
      - name: Commit generated package changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "zed-pkg automation"
          git config user.email "zed-pkg-automation@users.noreply.github.com"
          git add .zpkg.toml
          if [ "${{ inputs.kind }}" = "clients" ]; then git add clients; fi
          git commit -m "feat: standardize Zed ${{ inputs.kind }} package [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
