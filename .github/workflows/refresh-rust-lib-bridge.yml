name: Refresh Rust lib bridge candidate

on:
  push:
    branches:
      - chore/repin-rust-wasm-interfaces-20260910
    paths:
      - clients/rust/Cargo.toml
      - .github/workflows/refresh-rust-lib-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/repin-rust-wasm-interfaces-20260910
          fetch-depth: 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Install contract-generator dependencies
        run: python3 -m pip install --disable-pip-version-check tomlkit jsonschema
      - name: Regenerate only the Rust dependency and contract evidence
        shell: bash
        env:
          OLD_LIB: c8af76191f50ad7a177eb68740e69bdfaa652ff6
          NEW_LIB: 4509f19e1d3242226f28f842f550085864582380
          INTERFACES: 0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c
        run: |
          set -euo pipefail
          grep -Fq "rev = \"$NEW_LIB\"" clients/rust/Cargo.toml
          grep -Fq "rev = \"$INTERFACES\"" clients/rust/Cargo.toml
          (
            cd clients/rust
            cargo update \
              -p "git+https://github.com/zed-pkg/zed-lib-core.git?rev=${OLD_LIB}#zed-lib@0.1.0" \
              --precise "$NEW_LIB"
            cargo test --locked --all-targets
          )
          python3 scripts/harden_client_contract.py --schema schemas/client-api.schema.json --write
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' clients/contract-manifest.json clients/rust/Cargo.lock | sort)"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$expected"))"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected generated files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          grep -Fq "$NEW_LIB" clients/rust/Cargo.lock
          grep -Fq "$INTERFACES" clients/rust/Cargo.lock
          if grep -Fq "$OLD_LIB" clients/rust/Cargo.lock; then
            echo 'stale zed-lib source remains in Rust lock' >&2
            exit 1
          fi
          if grep -Fq 'd11322f06ca6930ddcc34a745b4ef01e0b2bddc1' clients/rust/Cargo.lock; then
            echo 'stale duplicate zed-interfaces identity remains in Rust lock' >&2
            exit 1
          fi
      - name: Commit generated evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/rust/Cargo.lock clients/contract-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: regenerate Rust client graph after lib-core admission'
          git push origin HEAD:chore/repin-rust-wasm-interfaces-20260910
