name: conformance-boundary

on:
  pull_request:
    paths:
      - 'clients/rust/Cargo.toml'
      - 'contracts/**'
      - 'conformance/**'
      - 'artifacts/conformance/evidence/**'
      - '.github/workflows/conformance-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'clients/rust/Cargo.toml'
      - 'contracts/**'
      - 'conformance/**'
      - 'artifacts/conformance/evidence/**'
      - '.github/workflows/conformance-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check consumed contract and conformance boundary
        run: |
          node --check conformance/check.mjs
          node --check conformance/boundary.mjs
          node conformance/check.mjs
