name: materialize exact Rust and WASM locks

on:
  push:
    branches:
      - automation/2026-08-30-target-migration-fixture
    paths:
      - .github/workflows/materialize-rust-wasm-locks.yml

permissions:
  contents: write

concurrency:
  group: materialize-rust-wasm-locks
  cancel-in-progress: false

jobs:
  resolve-verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact client branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/2026-08-30-target-migration-fixture
          path: zed-clients
          fetch-depth: 0
          show-progress: false

      - name: Check out exact merged interface contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 2c8c240a51e80ea34bd74e89b4e92c13b26d309f
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Verify the dependency source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-interfaces rev-parse HEAD)" = 2c8c240a51e80ea34bd74e89b4e92c13b26d309f
          test -f zed-interfaces/src/rust/Cargo.toml

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve both lockfiles from the exact source graph
        working-directory: zed-clients
        shell: bash
        run: |
          set -euo pipefail
          rust_before="$(sha256sum clients/rust/Cargo.lock | cut -d' ' -f1)"
          wasm_before="$(sha256sum clients/wasm/Cargo.lock | cut -d' ' -f1)"

          nix develop --no-update-lock-file '.#rust' -c \
            cargo generate-lockfile --manifest-path clients/rust/Cargo.toml
          nix develop --no-update-lock-file '.#wasm' -c \
            cargo generate-lockfile --manifest-path clients/wasm/Cargo.toml

          rust_after="$(sha256sum clients/rust/Cargo.lock | cut -d' ' -f1)"
          wasm_after="$(sha256sum clients/wasm/Cargo.lock | cut -d' ' -f1)"
          test "$rust_before" != "$rust_after"
          test "$wasm_before" != "$wasm_after"

      - name: Run the same locked stages used by the matrix
        working-directory: zed-clients
        shell: bash
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file '.#rust' -c agent-check rust
          nix develop --no-update-lock-file '.#wasm' -c agent-check wasm
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' clients/rust/Cargo.lock clients/wasm/Cargo.lock | sort)"

      - name: Remove bootstrap workflow and commit only resolver output
        working-directory: zed-clients
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-rust-wasm-locks.yml
          git add \
            .github/workflows/materialize-rust-wasm-locks.yml \
            clients/rust/Cargo.lock \
            clients/wasm/Cargo.lock
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' .github/workflows/materialize-rust-wasm-locks.yml clients/rust/Cargo.lock clients/wasm/Cargo.lock | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(rust): resolve exact Rust and WASM locks'
          git push origin HEAD:automation/2026-08-30-target-migration-fixture
