name: repair DEN-1425 Go Nix adapter

on:
  push:
    branches:
      - agent/den-1425-go-nix-adapter
    paths:
      - .github/workflows/repair-den-1425-go-nix-adapter.yml
  pull_request:
    branches:
      - agent/den-1425-go-nix-adapter
    paths:
      - .github/den-1425-go-repair-trigger

permissions:
  contents: read

concurrency:
  group: repair-den-1425-go-nix-adapter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.0.1
        with:
          ref: agent/den-1425-go-nix-adapter
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Repair the unclosed null-validation type switch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('clients/go/nix_adapter.go')
          text = path.read_text()
          old = '''\tcase []any:
\t\tfor _, child := range typed {
\t\t\tif err := rejectUnexpectedNulls(child, path); err != nil {
\t\t\t\treturn err
\t\t\t}
\t}
\treturn nil
}
'''
          new = '''\tcase []any:
\t\tfor _, child := range typed {
\t\t\tif err := rejectUnexpectedNulls(child, path); err != nil {
\t\t\t\treturn err
\t\t\t}
\t\t}
\t}
\treturn nil
}
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one unclosed type-switch anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w clients/go/nix_adapter.go clients/go/nix_adapter_test.go
          git diff --check

      - name: Validate the complete Go client package
        working-directory: clients/go
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Commit only the validated product repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/go/nix_adapter.go clients/go/nix_adapter_test.go
          git diff --cached --check
          git commit -m 'fix(DEN-1425): close Go null-validation type switch'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/den-1425-go-nix-adapter
