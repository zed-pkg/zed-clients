name: Bootstrap canonical client hardener

on:
  pull_request:
    paths:
      - '.bootstrap/harden.py.gz.b64.*'
      - '.github/workflows/bootstrap-client-hardener.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-client-hardener-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.ZED_FLEET_GH_TOKEN || github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Materialize and verify the canonical hardener
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat .bootstrap/harden.py.gz.b64.* | base64 --decode | gzip --decompress > scripts/harden_client_contract.py
          echo '141f949573fe0049f19ca186ecddd91db1f625d8a3f4279f6af5f12810d7dad0  scripts/harden_client_contract.py' | sha256sum --check --strict
          chmod +x scripts/harden_client_contract.py
          python -m pip install --disable-pip-version-check tomlkit jsonschema
          python -m py_compile scripts/harden_client_contract.py
          python -m unittest -v tests/test_harden_client_contract.py
      - name: Replace bootstrap payload with reviewed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm .github/workflows/bootstrap-client-hardener.yml
          git config user.name 'zed-pkg automation'
          git config user.email 'zed-pkg-automation@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add canonical polyglot client hardener'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
