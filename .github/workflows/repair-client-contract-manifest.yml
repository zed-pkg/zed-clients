name: Repair client contract manifest

on:
  push:
    branches: ["agent/source-policy-v2-8fc174b6940c"]
  pull_request:
    paths:
      - ".github/workflows/repair-client-contract-manifest.yml"
      - "clients/contract-manifest.json"

permissions:
  contents: write

concurrency:
  group: repair-client-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'zed-pkg/zed-clients'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Recompute implementation evidence from the clean checkout
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          manifest_path = root / "clients/contract-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          source_suffixes = {
              ".c", ".cc", ".cpp", ".cs", ".dart", ".erl", ".ex", ".exs",
              ".gleam", ".go", ".h", ".hpp", ".java", ".js", ".kt", ".kts",
              ".lua", ".mjs", ".ml", ".mli", ".php", ".py", ".rb", ".rs",
              ".scala", ".sh", ".swift", ".ts", ".zig",
          }
          metadata_names = {
              "CMakeLists.txt", "Cargo.toml", "Package.swift", "build.gradle",
              "build.gradle.kts", "build.zig", "composer.json", "deno.json", "dune",
              "gleam.toml", "go.mod", "mix.exs", "package.json", "pom.xml",
              "pubspec.yaml", "pyproject.toml", "rebar.config", "settings.gradle.kts",
          }
          metadata_suffixes = {".gemspec", ".opam"}
          ignored_parts = {
              ".build", ".dart_tool", ".gradle", ".zed-contracts", "build", "dist",
              "node_modules", "target", "test", "tests",
          }

          def digest(value):
              encoded = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          changed = []
          for entry in manifest["targets"]:
              directory = (root / entry["dir"]).resolve()
              if not directory.is_relative_to(root.resolve()) or not directory.is_dir():
                  raise SystemExit(f"unsafe or missing target directory: {entry['dir']}")
              records = []
              for path in sorted(directory.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(directory)
                  if ignored_parts.intersection(relative.parts):
                      continue
                  if not (
                      path.suffix.lower() in source_suffixes
                      or path.name in metadata_names
                      or path.suffix.lower() in metadata_suffixes
                  ):
                      continue
                  records.append({
                      "path": relative.as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
              records.sort(key=lambda item: item["path"])
              count = len(records)
              checksum = digest(records)
              if (
                  entry.get("implementationFileCount") != count
                  or entry.get("implementationSha256") != checksum
              ):
                  changed.append({
                      "target": entry["target"],
                      "oldCount": entry.get("implementationFileCount"),
                      "newCount": count,
                      "oldSha256": entry.get("implementationSha256"),
                      "newSha256": checksum,
                  })
                  entry["implementationFileCount"] = count
                  entry["implementationSha256"] = checksum

          print(json.dumps({"changes": changed}, indent=2, sort_keys=True))
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify repaired contract
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python scripts/verify_client_contract.py
      - name: Commit deterministic repair on the guarded push run
        if: github.event_name == 'push' && github.ref_name == 'agent/source-policy-v2-8fc174b6940c'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- clients/contract-manifest.json; then
            echo "manifest already matches the clean checkout"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/contract-manifest.json
          git commit -m "fix: regenerate client contract evidence from clean checkout"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
