name: temporary Nix formatter

on:
  push:
    branches:
      - alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
    paths:
      - flake.nix
      - .nix/dev-shell.nix
      - .github/workflows/format-nix-current-head.yml

permissions:
  contents: write

concurrency:
  group: temporary-nix-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[nixfmt applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
          show-progress: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Apply the flake-locked formatter and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          nix shell --no-update-lock-file .#formatter.x86_64-linux \
            -c nixfmt flake.nix .nix/dev-shell.nix
          rm .github/workflows/format-nix-current-head.yml
          unexpected=$(git diff --name-only \
            | grep -Ev '^(flake\.nix|\.nix/dev-shell\.nix|\.github/workflows/format-nix-current-head\.yml)$' \
            || true)
          if [[ -n "$unexpected" ]]; then
            printf 'formatter changed unexpected paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check
          git config user.name "zed-pkg nix formatter"
          git config user.email "zed-pkg-nix-formatter@users.noreply.github.com"
          git add flake.nix .nix/dev-shell.nix .github/workflows/format-nix-current-head.yml
          git commit -m "style(DEN-359): apply canonical Nix formatting [nixfmt applied]"
          git push origin HEAD:alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
