name: format clean staged Nix environment

on:
  push:
    branches:
      - alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
    paths:
      - .github/workflows/format-clean-nix-environment.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
          persist-credentials: true
          show-progress: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Format and parse the exact environment
        run: |
          set -euo pipefail
          nix shell nixpkgs#nixfmt -c nixfmt flake.nix .nix/dev-shell.nix
          nix-instantiate --parse flake.nix >/dev/null
          git diff --check
      - name: Remove formatter and commit canonical layout
        run: |
          set -euo pipefail
          rm .github/workflows/format-clean-nix-environment.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.nix .nix/dev-shell.nix .github/workflows/format-clean-nix-environment.yml
          git commit -m 'style: apply canonical nixfmt to the clean environment'
          git push origin HEAD:alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
