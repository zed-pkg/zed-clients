name: certify official Swift 6.1.3 stage

on:
  push:
    branches:
      - alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
    paths:
      - flake.nix
      - .nix/dev-shell.nix
      - .nix/swift-release.nix
      - .github/workflows/test-official-swift-stage.yml

permissions:
  contents: read

jobs:
  swift:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: zed-clients
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: 6e893ad0f28ccfbb7722f007d75e88548f1bcfdf
          path: zed-interfaces
          persist-credentials: false
          show-progress: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run exact pinned Swift stage
        working-directory: zed-clients
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file .#swift -c swift --version
          nix develop --no-update-lock-file .#swift -c agent-check swift
