name: DEN-3495 refresh Rust client lock

on:
  push:
    branches:
      - feat/DEN-3495-align-git-cli-install-contract
    paths:
      - ".github/workflows/den-3495-refresh-rust-client-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/DEN-3495-align-git-cli-install-contract
          fetch-depth: 1
          persist-credentials: true
      - name: Refresh reviewed Git sources in the Rust client lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("clients/rust/Cargo.lock")
          text = path.read_text()
          replacements = {
              "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
              "eac0878750332b031bc12f6040b6a795a17e7417": "c8af76191f50ad7a177eb68740e69bdfaa652ff6",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"expected at least one occurrence of {old}, found {count}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          cargo test --locked --manifest-path clients/rust/Cargo.toml
      - name: Commit deterministic Rust client lock refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "automation@oresoftware.com"
          git add clients/rust/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(DEN-3495): refresh Rust client contract lock"
          git push origin HEAD:feat/DEN-3495-align-git-cli-install-contract
