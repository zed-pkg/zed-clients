name: repair Swift test transport

on:
  push:
    branches:
      - alexanderdmills/den-359-zed-clients-nix-agent-shell
    paths:
      - .github/workflows/repair-swift-test-transport.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          show-progress: false

      - name: Add a deterministic injected test transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          production = Path('clients/swift/Sources/ZedClient/ZedClient.swift')
          source = production.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(source, '''private struct ErrorEnvelope: Decodable {
              let code: String?
          }
          ''', '''private struct ErrorEnvelope: Decodable {
              let code: String?
          }

          typealias DataLoader = (
              URLRequest,
              Int,
              Int
          ) async throws -> (Data, HTTPURLResponse)
          ''', 'data loader type')
          source = replace_once(source, '''    private let token: String?
              private let protocolClasses: [AnyClass]?
              private let encoder = JSONEncoder()
          ''', '''    private let token: String?
              private let dataLoader: DataLoader?
              private let encoder = JSONEncoder()
          ''', 'stored loader')
          source = replace_once(source, '''        self.token = Self.normalizeOptional(token)
              self.protocolClasses = nil
          ''', '''        self.token = Self.normalizeOptional(token)
              self.dataLoader = nil
          ''', 'public initializer')
          source = replace_once(source, '''    init(
              registryURL: String,
              token: String?,
              protocolClasses: [AnyClass]?
          ) throws {
              self.baseURL = try Self.validateBaseURL(registryURL)
              self.token = Self.normalizeOptional(token)
              self.protocolClasses = protocolClasses
          }
          ''', '''    init(
              registryURL: String,
              token: String?,
              dataLoader: DataLoader?
          ) throws {
              self.baseURL = try Self.validateBaseURL(registryURL)
              self.token = Self.normalizeOptional(token)
              self.dataLoader = dataLoader
          }
          ''', 'test initializer')
          source = replace_once(source, '''    ) async throws -> (Data, HTTPURLResponse) {
              try await withCheckedThrowingContinuation { continuation in
          ''', '''    ) async throws -> (Data, HTTPURLResponse) {
              if let dataLoader {
                  return try await dataLoader(request, successLimit, errorLimit)
              }
              return try await withCheckedThrowingContinuation { continuation in
          ''', 'loader dispatch')
          source = replace_once(source, '''            configuration.httpCookieAcceptPolicy = .never
              configuration.protocolClasses = protocolClasses

              let delegate = BoundedDataDelegate(
          ''', '''            configuration.httpCookieAcceptPolicy = .never

              let delegate = BoundedDataDelegate(
          ''', 'production URLSession configuration')
          production.write_text(source, encoding='utf-8')

          tests = Path('clients/swift/Tests/ZedClientTests/ZedClientTests.swift')
          test_source = tests.read_text(encoding='utf-8')
          test_source = test_source.replace('StubURLProtocol.handler', 'StubTransport.handler')
          test_source = replace_once(test_source, '            protocolClasses: [StubURLProtocol.self]\n', '            dataLoader: StubTransport.load\n', 'test client injection')
          pattern = re.compile(r'private final class StubURLProtocol: URLProtocol \{.*?\n\}\n\nprivate func bodyData', re.DOTALL)
          replacement = '''private enum StubTransport {
              static var handler: ((URLRequest) throws -> StubResponse)?

              static func load(
                  _ request: URLRequest,
                  _ successLimit: Int,
                  _ errorLimit: Int
              ) async throws -> (Data, HTTPURLResponse) {
                  let handler = try XCTUnwrap(Self.handler)
                  let stub = try handler(request)
                  let response = try XCTUnwrap(HTTPURLResponse(
                      url: try XCTUnwrap(request.url),
                      statusCode: stub.status,
                      httpVersion: "HTTP/1.1",
                      headerFields: stub.headers
                  ))
                  let successful = (200..<300).contains(stub.status)
                  let limit = successful ? successLimit : errorLimit
                  let declared = stub.headers.first { key, _ in
                      key.caseInsensitiveCompare("Content-Length") == .orderedSame
                  }.flatMap { Int($0.value) }
                  if successful && (declared ?? stub.body.count) > limit {
                      throw ZedClientError.responseTooLarge(limit: limit)
                  }
                  return (Data(stub.body.prefix(limit)), response)
              }
          }

          private func bodyData'''
          test_source, count = pattern.subn(replacement, test_source, count=1)
          if count != 1:
              raise SystemExit(f'test transport block: expected one match, found {count}')
          tests.write_text(test_source, encoding='utf-8')
          PY
          git diff --check

      - name: Commit the test seam
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clients/swift/Sources/ZedClient/ZedClient.swift clients/swift/Tests/ZedClientTests/ZedClientTests.swift
          git commit -m 'DEN-359 inject the Swift test transport directly'
          git push origin HEAD:${GITHUB_REF_NAME}
