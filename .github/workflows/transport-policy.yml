name: Rust transport policy

on:
  pull_request:
    paths:
      - 'clients/**'
      - 'TRANSPORT.md'
      - '.github/workflows/transport-policy.yml'

permissions:
  contents: read

jobs:
  no-new-blocking-reqwest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject blocking reqwest outside the grandfathered client
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=target --exclude='lib.rs' 'reqwest::blocking' clients; then
            echo 'reqwest::blocking is deprecated; use clients/rust-async.' >&2
            exit 1
          fi

      - name: Reject newly added blocking reqwest calls anywhere
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --unified=0 "$base" "$head" -- clients \
            | grep -E '^\+[^+].*reqwest::blocking' \
            && {
              echo 'new reqwest::blocking call sites are forbidden; use zed-client-async/Hyper.' >&2
              exit 1
            }
          exit 0
