name: one-shot interface tip compatibility fix

on:
  push:
    branches:
      - automation/2026-08-30-target-migration-fixture

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out client branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: zed-clients
          persist-credentials: true
          show-progress: false

      - name: Check out current interface authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: 3c54298fc7a8c1b2f9c1d74f588c6118b38f197e
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Apply the minimal fixture compatibility repair
        working-directory: zed-clients
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('clients/rust/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(fn version\(url: &str, sha256: &str, size: u64\) -> VersionMetadata \{'
              r'.*?\n\s+yanked: false,\n)(\s+\}\n)',
              re.DOTALL,
          )
          replacement = r'\1            mirrors: Vec::new(),\n            signatures: Vec::new(),\n\2'
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one VersionMetadata fixture, replaced {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          cargo fmt --manifest-path clients/rust/Cargo.toml
          cargo fmt --manifest-path clients/rust/Cargo.toml -- --check

      - name: Test against the exact current interface tip
        working-directory: zed-clients/clients/rust
        run: |
          set -euo pipefail
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Commit only the tested source and lock, then remove this workflow
        working-directory: zed-clients
        env:
          BRANCH_NAME: automation/2026-08-30-target-migration-fixture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          output = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-z'],
              text=True,
          )
          paths = []
          records = output.split('\0')
          index = 0
          while index < len(records) and records[index]:
              record = records[index]
              status = record[:2]
              paths.append(record[3:])
              index += 2 if status[0] in {'R', 'C'} else 1
          expected = {'clients/rust/src/lib.rs', 'clients/rust/Cargo.lock'}
          if set(paths) != expected:
              raise SystemExit(f'expected only {sorted(expected)}, got {sorted(paths)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/rust/src/lib.rs clients/rust/Cargo.lock
          git rm .github/workflows/automation-interface-tip-fix.yml
          git diff --cached --check
          git commit -m 'test(rust): support signed mirrored version metadata'
          git push origin "HEAD:$BRANCH_NAME"
