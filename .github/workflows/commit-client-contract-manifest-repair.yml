name: Commit client contract manifest repair

on:
  pull_request:
    paths:
      - ".github/workflows/commit-client-contract-manifest-repair.yml"

permissions:
  contents: write

concurrency:
  group: commit-client-contract-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  commit-repair:
    if: >-
      github.repository == 'zed-pkg/zed-clients' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/source-policy-v2-8fc174b6940c'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/source-policy-v2-8fc174b6940c
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply reviewed clean-checkout evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('clients/contract-manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          evidence = {
              'zig': (2, 'd2a122b0c697653ac28cfb00492c8eb22543009170408d3eda522ec843378da9'),
              'elixir': (3, 'b3782a425082922ca843facbfa4150dc74e4b290bfb0b59db089931fded53c23'),
          }
          seen = set()
          for entry in manifest['targets']:
              target = entry.get('target')
              if target not in evidence:
                  continue
              count, checksum = evidence[target]
              entry['implementationFileCount'] = count
              entry['implementationSha256'] = checksum
              seen.add(target)
          if seen != set(evidence):
              raise SystemExit(f'missing manifest targets: {sorted(set(evidence) - seen)}')
          path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python scripts/verify_client_contract.py
          git diff --check
      - name: Commit repair to the guarded PR branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- clients/contract-manifest.json; then
            echo "manifest already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/contract-manifest.json
          git commit -m "fix: regenerate client contract evidence from clean checkout"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:agent/source-policy-v2-8fc174b6940c"
