name: DEN-3495 refresh client contract evidence

on:
  push:
    branches:
      - feat/DEN-3495-align-git-cli-install-contract
    paths:
      - ".github/workflows/den-3495-refresh-client-contract-evidence.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/DEN-3495-align-git-cli-install-contract
          fetch-depth: 1
          persist-credentials: true
      - name: Install hardener dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1 tomlkit==0.13.3
      - name: Regenerate deterministic implementation evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/harden_client_contract.py \
            --schema schemas/client-api.schema.json \
            --write \
            --output "$RUNNER_TEMP/contract-refresh.json"
          python scripts/verify_client_contract.py
          git diff --check
      - name: Commit deterministic contract evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "automation@oresoftware.com"
          git add clients .zpkg.toml
          git diff --cached --quiet && exit 0
          git commit -m "chore(DEN-3495): refresh client contract evidence"
          git push origin HEAD:feat/DEN-3495-align-git-cli-install-contract
