# Temporary branch-only lock materializer; removed before pull-request review.
name: materialize shared Rust client boundary

on:
  push:
    branches: [feat/shared-rust-client-boundary]
    paths:
      - ".github/workflows/materialize-shared-rust-client-boundary.yml"

permissions:
  contents: write

concurrency:
  group: materialize-shared-rust-client-boundary
  cancel-in-progress: true

jobs:
  lock-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Refresh exact locks and prove native plus WASM clients
        run: |
          set -euo pipefail
          cargo fmt --manifest-path clients/rust/Cargo.toml -- --check
          cargo fmt --manifest-path clients/wasm/Cargo.toml -- --check
          cargo generate-lockfile --manifest-path clients/rust/Cargo.toml
          cargo generate-lockfile --manifest-path clients/wasm/Cargo.toml
          cargo test --locked --manifest-path clients/rust/Cargo.toml
          cargo test --locked --manifest-path clients/wasm/Cargo.toml
          cargo check --locked --manifest-path clients/wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Commit exact locks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/rust/Cargo.lock clients/wasm/Cargo.lock
          if git diff --cached --quiet; then
            echo "Rust and WASM locks are already current"
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore(lock): pin merged zed-lib client graph"
          git push origin HEAD:feat/shared-rust-client-boundary
