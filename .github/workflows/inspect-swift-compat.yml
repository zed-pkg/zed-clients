name: inspect Swift compatibility dependencies

on:
  push:
    branches:
      - alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
    paths:
      - .github/workflows/inspect-swift-compat.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: alexanderdmills/den-359-zed-clients-nix-agent-shell-v4
          persist-credentials: false
          show-progress: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Inspect exact locked package attributes and library outputs
        run: |
          set -euo pipefail
          nix eval --json --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; };
              matching = pattern: builtins.filter (name: builtins.match pattern name != null) (builtins.attrNames pkgs);
            in {
              python = matching "python3(10|11|12|13).*";
              libxml = matching "libxml2.*";
              hasPython310 = pkgs ? python310;
              hasPython310Lib = pkgs ? python310 && pkgs.python310 ? lib;
              libxmlVersion = pkgs.libxml2.version;
            }
          ' | jq .
          nix eval --raw --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; };
            in if pkgs ? python310 then pkgs.python310.version else "missing"
          '
          printf '\n'
