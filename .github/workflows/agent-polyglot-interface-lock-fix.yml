name: agent polyglot interface lock and Nix compatibility

on:
  push:
    branches:
      - fix/interfaces-path-after-polyglot
    paths:
      - .github/workflows/agent-polyglot-interface-lock-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-polyglot-interface-lock-and-nix-compatibility
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact client branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/interfaces-path-after-polyglot
          path: zed-clients
          fetch-depth: 0

      - name: Check out exact merged polyglot interface contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: 5394b2e7b070354ee79a4c6ac79c26d6264970cd
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain action
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Install pinned Nix action
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Repair sibling discovery, Swift portability, formatting, and locks
        working-directory: zed-clients
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.nix/agent-check.sh')
          source = path.read_text(encoding='utf-8')

          old_path = '$interfaces_root/Cargo.toml'
          new_path = '$interfaces_root/src/rust/Cargo.toml'
          if source.count(old_path) != 2:
              raise SystemExit('expected two legacy interface manifest paths')
          source = source.replace(old_path, new_path)

          old_message = 'Rust and WASM checks require zed-pkg/zed-interfaces as a sibling checkout:'
          new_message = 'Rust and WASM checks require the polyglot zed-interfaces Rust slice as a sibling checkout:'
          if source.count(old_message) != 1:
              raise SystemExit('expected one legacy interface checkout message')
          source = source.replace(old_message, new_message, 1)

          old_swift = '        swift test --parallel'
          new_swift = '''        swift build
                  if [[ "$(uname -s)" == "Darwin" ]]; then
                    swift test --parallel
                  else
                    printf 'Swift XCTest is unavailable in the pinned Linux toolchain; build succeeded.\n'
                  fi'''
          if source.count(old_swift) != 1:
              raise SystemExit('expected one unconditional Swift test command')
          path.write_text(source.replace(old_swift, new_swift, 1), encoding='utf-8')
          PY

          nix develop --no-update-lock-file .#preflight -c nixfmt flake.nix
          cargo generate-lockfile --manifest-path clients/rust/Cargo.toml
          cargo generate-lockfile --manifest-path clients/wasm/Cargo.toml
          cargo generate-lockfile --manifest-path tests/native-lock-consumer/Cargo.toml

          test "$(git -C ../zed-interfaces rev-parse HEAD)" = 5394b2e7b070354ee79a4c6ac79c26d6264970cd
          test -f ../zed-interfaces/src/rust/Cargo.toml

      - name: Verify locked Rust, WASM, consumer, and Nix paths
        working-directory: zed-clients
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path clients/rust/Cargo.toml -- --check
          cargo test --locked --manifest-path clients/rust/Cargo.toml
          cargo clippy --locked --manifest-path clients/rust/Cargo.toml --all-targets -- -D warnings

          cargo fmt --all --manifest-path clients/wasm/Cargo.toml -- --check
          cargo test --locked --manifest-path clients/wasm/Cargo.toml
          cargo check --locked --manifest-path clients/wasm/Cargo.toml --target wasm32-unknown-unknown

          cargo run --locked --manifest-path tests/native-lock-consumer/Cargo.toml

          nix develop --no-update-lock-file .#preflight -c nixfmt --check flake.nix .nix/dev-shell.nix
          nix develop --no-update-lock-file .#preflight -c shellcheck .nix/agent-check.sh
          nix develop --no-update-lock-file .#preflight -c shfmt -i 2 -ci -d .nix/agent-check.sh
          nix flake check --no-update-lock-file --show-trace
          nix develop --no-update-lock-file .#preflight -c agent-check preflight
          nix develop --no-update-lock-file .#swift -c agent-check swift

      - name: Commit only durable compatibility repairs and remove this helper
        working-directory: zed-clients
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-polyglot-interface-lock-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .nix/agent-check.sh \
            flake.nix \
            clients/rust/Cargo.lock \
            clients/wasm/Cargo.lock \
            tests/native-lock-consumer/Cargo.lock
          git diff --cached --check
          changed="$(git diff --cached --name-only | paste -sd ' ' -)"
          expected='.github/workflows/agent-polyglot-interface-lock-fix.yml .nix/agent-check.sh clients/rust/Cargo.lock clients/wasm/Cargo.lock flake.nix tests/native-lock-consumer/Cargo.lock'
          test "$changed" = "$expected"
          git commit -m 'fix: align client locks and Nix gates with polyglot interfaces'
          git push origin HEAD:fix/interfaces-path-after-polyglot
