name: bootstrap Rust Nix interface pin

on:
  push:
    branches:
      - automation/2026-08-30-target-migration-fixture
    paths:
      - .github/workflows/bootstrap-rust-nix-interface-pin.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-rust-nix-interface-pin
  cancel-in-progress: false

jobs:
  update-lock-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the preserved Rust compatibility branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: automation/2026-08-30-target-migration-fixture
          path: zed-clients
          fetch-depth: 0

      - name: Check out the exact signing and mirror interface revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: 3c54298fc7a8c1b2f9c1d74f588c6118b38f197e
          path: zed-interfaces
          persist-credentials: false

      - name: Regenerate the path-dependency lock and align the Nix canary
        working-directory: zed-clients
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/nix.yml')
          source = path.read_text(encoding='utf-8')
          old = '5394b2e7b070354ee79a4c6ac79c26d6264970cd'
          new = '3c54298fc7a8c1b2f9c1d74f588c6118b38f197e'
          if source.count(old) != 2:
              raise SystemExit('expected exactly two old Nix interface pins')
          path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')
          PY
          (cd clients/rust && cargo generate-lockfile && cargo test --locked)
          test "$(git -C ../zed-interfaces rev-parse HEAD)" = 3c54298fc7a8c1b2f9c1d74f588c6118b38f197e
          grep -Fq '3c54298fc7a8c1b2f9c1d74f588c6118b38f197e' .github/workflows/nix.yml
          ! grep -Fq '5394b2e7b070354ee79a4c6ac79c26d6264970cd' .github/workflows/nix.yml
          git diff --check

      - name: Commit only the Nix pin and resolver lock
        working-directory: zed-clients
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-rust-nix-interface-pin.yml
          git add .github/workflows/nix.yml clients/rust/Cargo.lock \
            .github/workflows/bootstrap-rust-nix-interface-pin.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(nix): align the Rust interface pin and lock'
          git push origin HEAD:automation/2026-08-30-target-migration-fixture
