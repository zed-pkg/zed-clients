name: Refresh client interface locks

on:
  push:
    branches:
      - chore/repin-rust-wasm-interfaces-20260910
    paths:
      - clients/rust/Cargo.toml
      - clients/wasm/Cargo.toml
      - .github/workflows/refresh-client-interface-locks.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: chore/repin-rust-wasm-interfaces-20260910

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Regenerate native and WASM lockfiles with Cargo
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path clients/rust/Cargo.toml -p zed-interfaces
          cargo update --manifest-path clients/wasm/Cargo.toml -p zed-interfaces
          grep -Fq '6e8f65d786330ade0cdc89f9877bba42c9e8f21a' clients/rust/Cargo.lock
          grep -Fq '6e8f65d786330ade0cdc89f9877bba42c9e8f21a' clients/wasm/Cargo.lock
          git diff --check

      - name: Commit generated locks only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/rust/Cargo.lock clients/wasm/Cargo.lock; then
            echo 'Cargo lockfiles already match the requested interfaces revision.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients/rust/Cargo.lock clients/wasm/Cargo.lock
          git commit -m 'chore: refresh client locks for interfaces repin'
          git push origin HEAD:chore/repin-rust-wasm-interfaces-20260910
